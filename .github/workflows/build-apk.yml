name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.2

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sg-sms-gateway-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Build release AAB (signed with stored keystore)
        run: |
          gradle bundleRelease --no-daemon \
            -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/keystore/sg-release.keystore \
            -Pandroid.injected.signing.store.password="SgSms2026!" \
            -Pandroid.injected.signing.key.alias=sg-sms-gateway \
            -Pandroid.injected.signing.key.password="SgSms2026!"

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: sg-sms-gateway-aab
          path: app/build/outputs/bundle/release/app-release.aab
